<div class="app-layout">
  <div class="container">
    @switch (currentScreen()) {
      @case ('LANDING') {
        <app-landing-page
          (authSuccess)="handleAuthSuccess()"
          (exploreAsGuest)="handleExploreRequest()"
        ></app-landing-page>
      }
      @case ('HOME') {
        <app-home-page
          (logout)="handleLogout()"
        ></app-home-page>
      }
    }
  </div>

  <!-- Toast Container -->
  @if (toastMessage()) {
    <div class="toast-container">
      <div class="toast">{{ toastMessage() }}</div>
    </div>
  }
</div>
